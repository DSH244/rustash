[package]
name = "rustash"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust QStash-compatible message dispatch service backed by SQLite"

[lib]
name = "rustash"
path = "src/lib.rs"

[[bin]]
name = "rustash"
path = "src/main.rs"

[[bin]]
name = "rs-check"
path = "src/bin/rs-check.rs"

[dependencies]
axum = { version = "0.7", features = ["json", "query"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
croner = "4"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
httpdate = "1"
percent-encoding = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
tower = { version = "0.4" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["std"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
